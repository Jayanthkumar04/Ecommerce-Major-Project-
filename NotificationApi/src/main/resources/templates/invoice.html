<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            color: #333;
        }

        .section {
            margin-top: 20px;
        }

        .section p {
            margin: 5px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        .header-table {
            border-bottom: 2px solid #eee;
            margin-bottom: 15px;
        }

        .header-title {
            font-size: 26px;
            font-weight: bold;
            text-align: right;
        }

        .logo {
            max-width: 180px;
        }

        .items-table {
            margin-top: 15px;
        }

        .items-table th {
            background-color: #f5f5f5;
            font-weight: bold;
            text-align: center;
        }

        .items-table th, 
        .items-table td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        .items-table td {
            text-align: center;
        }

        .items-table td:first-child {
            text-align: left;
        }

        .total {
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            text-align: center;
            color: #777;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<table class="header-table">
    <tr>
        <td style="text-align: left;">
            <img src="data:image/png;base64,{{logo}}" class="logo" style="width:150px; height:auto;"/>
        </td>
        <td class="header-title">
            INVOICE
        </td>
    </tr>
</table>

<!-- ORDER DETAILS -->
<div class="section">
    <p><strong>Order ID:</strong> {{orderId}}</p>
    <p><strong>Tracking No:</strong> {{tracking}}</p>
    <p><strong>Email:</strong> {{email}}</p>
</div>

<!-- ITEMS TABLE -->
<div class="section">
    <table class="items-table">
        <thead>
            <tr>
                <th>Product</th>
                <th>Qty</th>
                <th>Price (Rs.)</th>
                <th>Total (Rs.)</th>
            </tr>
        </thead>

        <tbody>
            {{items}}
        </tbody>
    </table>
</div>

<!-- TOTAL -->
<div class="total">
    Total Amount: Rs.{{total}}
</div>

<!-- FOOTER -->
<div class="footer">
    Thank you for your purchase!<br/>
    This is a system generated invoice.
</div>

</body>
</html>

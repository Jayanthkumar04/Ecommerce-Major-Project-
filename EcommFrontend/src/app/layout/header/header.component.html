<header class="header-desktop">
  <div class="section-content section-content-p30">
    <div class="container-fluid">
      <div class="header-wrap">

        <!-- SEARCH -->
        <form class="form-header" (submit)="$event.preventDefault()" *ngIf="role === 'ROLE_USER'">
          <input class="au-input au-input-xl" type="text" placeholder="Search for data ..." #searchInput
            (keyup)="doSearch(searchInput.value)" />
          <button class="au-btn-submit" type="submit">
            Search
          </button>
        </form>

        <!-- CART + USER -->
        <div class="cart-area d-n">

          <!-- Greeting -->
          <h6 *ngIf="isLogin">
            Hey {{name}} !
          </h6>

          <button *ngIf="isLogin && role === 'ROLE_USER' " routerLink="/orders-dashboard"
            class="au-btn-submit login-btn">
            MyOrders
          </button>

          <button *ngIf="isLogin && role === 'ROLE_ADMIN' " routerLink="/admin-dashboard"
            class="au-btn-submit login-btn">
            <p style="font-size: small;">ADMIN DASHBOARD</p>
          </button>

          <!-- Cart -->
          <a routerLink="cart-detail" class="cart-link" *ngIf="role === 'ROLE_USER'">
            <div class="total">
              {{totalPrice | currency:'INR'}}
              <span>{{totalQuantity}}</span>
            </div>
            <i class="fa fa-shopping-cart"></i>
          </a>

          <!-- Login -->
          <button *ngIf="!isLogin" routerLink="/login" class="au-btn-submit login-btn">
            Login
          </button>

          <!-- Logout -->
          <button *ngIf="isLogin" (click)="logout()" class="au-btn-submit login-btn">
            Logout
          </button>

        </div>

      </div>
    </div>
  </div>
</header>
